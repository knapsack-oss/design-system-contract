StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Microsoft
Vocab = DSC

[*.html]
BasedOnStyles = Vale, Microsoft

# Reference voice uses formal negation ("does not"), not contractions.
Microsoft.Contractions = NO
# Headings are sentence case; the word after a colon stays lowercase.
Microsoft.HeadingColons = NO
# Page topics are named by acronym (DSDS), so headings must carry it.
Microsoft.HeadingAcronyms = NO
# Developer audience: "URL" is the expected term.
Microsoft.GeneralURL = NO
# Word-list prompts with no actionable fix.
Microsoft.Vocab = NO
